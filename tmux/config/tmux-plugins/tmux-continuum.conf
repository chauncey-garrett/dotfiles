#
# Continuum
# https://github.com/tmux-plugins/tmux-continuum
#

# REQUIRED for autosave to work at all — do not delete as "redundant".
# Continuum installs its autosave as a `#()` interpolation in `status-right`,
# which only re-evaluates when the status line redraws. tmux-powerline.conf
# (sourced earlier, from tmux.conf) sets `status-interval 0`, disabling those
# redraws — which silently stops the save timer from ever ticking on an idle
# session, exactly the case this plugin exists to cover. This file is sourced
# after tmux-powerline.conf, so this setting wins.
set -g status-interval 60

# Autosave every 5 minutes (the plugin's own default is 15)
set -g @continuum-save-interval '5'

# Auto-restore on the first tmux server start after a crash/reboot
set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
