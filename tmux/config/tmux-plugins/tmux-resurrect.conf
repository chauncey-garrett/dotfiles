#
# Resurrect
# https://github.com/tmux-plugins/tmux-resurrect
#

# Relaunch any pane whose saved command line matches "claude" as
# `claude --continue`, regardless of how that pane was originally invoked
set -g @resurrect-processes '"~claude->claude --continue"'

set -g @plugin 'tmux-plugins/tmux-resurrect'
