#
# Resurrect
# https://github.com/tmux-plugins/tmux-resurrect
#

# Relaunch any pane whose saved command line contains "claude" through
# claude-restore. Resurrect replaces `*` with the saved command's arguments, so
# a pane saved as `claude -r <uuid>` resumes exactly that conversation, and a
# worktree pane relaunches from its main checkout. Panes saved without an id
# get the resolver's fallback. Before 2026-11-12 this setting was a plain
# `claude --continue`, which dropped the saved id: two panes in one directory
# both came back as the same conversation. Tests: make test-claude-restore
set -g @resurrect-processes '"~claude->~/.dotfiles/tmux/bin/claude-restore *"'

set -g @plugin 'tmux-plugins/tmux-resurrect'
